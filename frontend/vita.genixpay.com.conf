<VirtualHost *:80>
    ServerName vita.genixpay.com
    ServerAlias www.vita.genixpay.com

    # Redirect all HTTP → HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    ErrorLog /var/log/apache2/vita.genixpay-http-error.log
    CustomLog /var/log/apache2/vita.genixpay-http-requests.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName vita.genixpay.com
    ServerAlias www.vita.genixpay.com

    SSLEngine On
    SSLProxyEngine on
    SSLCertificateFile      /etc/cert/imran/pg.genixpay.com_certificate.crt
    SSLCertificateKeyFile   /etc/cert/imran/pg.genixpay.com_key.key
    SSLCACertificateFile    /etc/cert/imran/pg.genixpay.com_bundle.ca.crt

    # ── Important: tell backend the real protocol ───────────────────────────
    RequestHeader set X-Forwarded-Proto  "https"
    RequestHeader set X-Forwarded-Port   "443"
    RequestHeader set X-Forwarded-Host   "vita.genixpay.com"

    ProxyPreserveHost On
    Timeout      2400
    ProxyTimeout 2400
    ProxyBadHeader Ignore

    # ── Enable WebSocket proxying (required for Next.js HMR & SSE) ──────────
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) ws://127.0.0.1:3000/$1 [P,L]

    # ── Next.js API routes (frontend port 3000) — MUST be before /api rule ────
    # These are Next.js server-side API routes, NOT backend routes

    # /api/tts — OpenAI TTS (Text-to-Speech) — frontend Next.js route
    ProxyPass        /api/tts          http://127.0.0.1:3000/api/tts
    ProxyPassReverse /api/tts          http://127.0.0.1:3000/api/tts

    # /api/interview — AI chat (exact path only, no subpaths like /history /session)
    # ProxyPassMatch uses regex: ^/api/interview$ matches ONLY /api/interview exactly
    # /api/interview/history, /api/interview/session/... go to backend below
    ProxyPassMatch   ^/api/interview$  http://127.0.0.1:3000/api/interview

    # ── Backend Node.js API  (IMPORTANT: prefix is KEPT — backend uses /api/) ─
    # Apache passes /api/auth/login → backend as /api/auth/login  ✓
    ProxyPass        /api  http://127.0.0.1:5000/api
    ProxyPassReverse /api  http://127.0.0.1:5000/api

    # ── Uploaded files served by the backend ────────────────────────────────
    ProxyPass        /uploads  http://127.0.0.1:5000/uploads
    ProxyPassReverse /uploads  http://127.0.0.1:5000/uploads

    # ── Next.js Frontend (catch-all, must be LAST) ───────────────────────────
    ProxyPass        /  http://127.0.0.1:3000/
    ProxyPassReverse /  http://127.0.0.1:3000/

    ErrorLog  /var/log/apache2/vita.genixpay.com-error.log
    CustomLog /var/log/apache2/vita.genixpay.com-requests.log combined
</VirtualHost>

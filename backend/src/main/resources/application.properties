spring.config.import=optional:dotenv:./.env,optional:dotenv:./backend/.env,optional:dotenv:../backend/.env

# Server
server.port=${SERVER_PORT:8080}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/resume_ai_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET:defaultSecretKeyChangeInProduction256BitsLong}
app.jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Gemini AI
app.gemini.api-key=AIzaSyCjkvAmBjagWOyy7q5lSfv2hzhcuUZUSOo
app.gemini.api-url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent}

# File Upload
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# CORS
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000}

# Logging
logging.level.com.resumeai=INFO
logging.level.org.springframework.security=WARN
